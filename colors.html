<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الألوان - عالم الأرقام الصغيرة</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<h1 id="gameTitle">🎨 الألوان</h1>

<div class="game">
  <!-- أزرار التنقل -->
  <div class="modes">
    <button id="mLearn" class="on" onclick="Game.switchMode('learn')">📖 تعليم</button>
    <button id="mQuiz" onclick="Game.switchMode('quiz')">🎮 اختبار</button>
  </div>

  <!-- قسم التعليم -->
  <div class="panel on" id="pLearn">
    <h3>اضغط على أي لون تسمع اسمه</h3>
    <div class="grid" id="learnGrid"></div>
    <div id="info">اختر لون 👇</div>
  </div>

  <!-- قسم الاختبار -->
  <div class="panel" id="pQuiz">
    <div class="stars" id="stars">☆☆☆☆☆</div>
    <div class="question" id="question">اضغط "اسمع" باش تبدا</div>
    <button class="speak" onclick="Game.hear()">📢 اسمع</button>
    <div class="grid" id="quizGrid"></div>
    <div id="result"></div>
  </div>

  <button class="back-btn" onclick="location.href='index.html'">🏠 رجوع للرئيسية</button>
</div>

<script src="shared/voice.js"></script>
<script src="shared/game-engine.js"></script>
<script>
  // تشغيل اللعبة وإعدادات قسم الألوان
  Game.init({
    title: '🎨 الألوان',
    items: ['أحمر', 'أزرق', 'أخضر', 'أصفر', 'برتقالي', 'بنفسجي'], // 6 ألوان
    speakItem: (c) => c,
    targetSpeak: (c) => `وين راه اللون ${c}؟`,
    correctMsg: 'برافو! 🌈',
    wrongMsg: 'عاود حاول 🎨',
    choicesCount: 3, // 3 خيارات
    colorMode: 'text', // باش الصناديق تبان بلون واحد وما تتلخبطش
    speechKey: 'color_'
  });
</script>

</body>
</html>
